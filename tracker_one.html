<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tracker One</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin:0; font-family:sans-serif; }
    #map { width:100vw; height:100vh; }
    #panel {
      position:absolute; top:10px; left:10px; z-index:1000;
      background:#fff; padding:10px; border-radius:8px;
      box-shadow:0 2px 8px rgba(0,0,0,.2);
    }
    #status { margin-top:6px; font-size:12px; color:#333; }
  </style>
</head>
<body>
  <div id="panel">
    device_id: <input id="dev" value="1" size="4">
    limit: <input id="limit" value="10" size="5">
    <button id="load">軌跡表示</button>
    <div id="status">status: -</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_BASE = "https://fyx3533ssl.execute-api.us-east-1.amazonaws.com/prod";
    const statusEl = document.getElementById("status");

    // ★ここで status が変わらないなら、JSが動いていない
    statusEl.textContent = "status: script started";

    // JSエラーを画面に出す（最重要）
    window.addEventListener("error", (e) => {
      statusEl.textContent = "status: JS ERROR: " + e.message;
    });

    // Leaflet が読めているかチェック
    if (typeof L === "undefined") {
      statusEl.textContent = "status: Leaflet not loaded (L is undefined)";
      throw new Error("Leaflet not loaded");
    }

    const map = L.map('map').setView([34.70, 137.72], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;
    let poly = null;
    const e7 = v => v / 1e7;

    async function loadHistory(deviceId, limit){
      const url = `${API_BASE}/history?device_id=${encodeURIComponent(deviceId)}&limit=${encodeURIComponent(limit)}`;
      statusEl.textContent = "status: fetching " + url;

      const r = await fetch(url);
      statusEl.textContent = "status: fetch HTTP " + r.status;

      if(!r.ok) throw new Error(`history fetch failed: ${r.status}`);
      return await r.json();
    }

    async function draw(){
      const deviceId = Number(document.getElementById("dev").value);
      const limit = Number(document.getElementById("limit").value);

      const data = await loadHistory(deviceId, limit);
      const pts = (data.items || []).map(p => [e7(p.lat), e7(p.lon)]);

      statusEl.textContent = `status: got ${pts.length} points`;
      if (pts.length === 0) return;

      const last = pts[pts.length - 1];

      if (!marker) marker = L.marker(last).addTo(map);
      else marker.setLatLng(last);

      if (!poly) poly = L.polyline(pts, {color:"red"}).addTo(map);
      else poly.setLatLngs(pts);

      map.fitBounds(poly.getBounds(), { maxZoom: 17 });
      statusEl.textContent = `status: drawn (points=${pts.length})`;
    }

    document.getElementById("load").addEventListener("click", ()=>draw().catch(err=>{
      console.error(err);
      statusEl.textContent = "status: ERROR " + err.message;
    }));

    // 初回自動ロード
    draw().catch(err=>{
      console.error(err);
      statusEl.textContent = "status: ERROR " + err.message;
    });
  </script>
</body>
</html>
